name: lefteria-fc-os

# Shared production container baseline; edge/database require limited exceptions.
x-hardened-runtime: &hardened-runtime
  restart: unless-stopped
  init: true
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  proxy:
    <<: *hardened-runtime
    # Official Caddy binary needs this single retained capability.
    cap_add: [NET_BIND_SERVICE]
    tmpfs: [/tmp:size=16m]
    mem_limit: ${LEFTERIA_PROXY_MEMORY_LIMIT:-128m}
    cpus: ${LEFTERIA_PROXY_CPUS:-0.5}
    pids_limit: 96
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      public: {}
      app:
        ipv4_address: ${TRUSTED_PROXY_IP:-172.28.90.2}

  web:
    <<: *hardened-runtime
    tmpfs: [/tmp:size=32m]
    mem_limit: ${LEFTERIA_WEB_MEMORY_LIMIT:-512m}
    cpus: ${LEFTERIA_WEB_CPUS:-1.0}
    pids_limit: 160
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      INTERNAL_API_ORIGIN: http://api:8080
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app

  api:
    <<: *hardened-runtime
    tmpfs: [/tmp:size=64m]
    mem_limit: ${LEFTERIA_API_MEMORY_LIMIT:-768m}
    cpus: ${LEFTERIA_API_CPUS:-1.0}
    pids_limit: 160
    image: ${LEFTERIA_API_IMAGE:-lefteria-fc-os-api:local}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Host: postgres
      Database__Name: $POSTGRES_DB
      Database__Username: ${DATABASE_APP_USER:?Set DATABASE_APP_USER in .env}
      Database__Password: ${DATABASE_APP_PASSWORD:?Set DATABASE_APP_PASSWORD in .env}
      WebAdmin__Enabled: "${WEB_ADMIN_ENABLED:-false}"
      WebAdmin__PublicOrigin: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      WebAdmin__Host: postgres
      WebAdmin__Database: $POSTGRES_DB
      WebAdmin__Username: ${DATABASE_ADMIN_AUTH_USER:-}
      WebAdmin__Password: ${DATABASE_ADMIN_AUTH_PASSWORD:-}
      WebAdmin__ThrottleKey: ${WEB_ADMIN_THROTTLE_KEY:-}
      MobileAuth__SigningKey: ${MOBILE_SIGNING_KEY:?Set a random base64 MOBILE_SIGNING_KEY}
      MobileAuth__OtpKey: ${MOBILE_OTP_KEY:?Set a separate random base64 MOBILE_OTP_KEY}
      LegacyMobileBridge__Enabled: "${LEGACY_MOBILE_BRIDGE_ENABLED:-false}"
      LegacyMobileBridge__SigningSecret: ${LEGACY_MOBILE_SIGNING_SECRET:-}
      LegacyMobileBridge__FingerprintKey: ${LEGACY_MOBILE_FINGERPRINT_KEY:-}
      LegacyMobileBridge__StartsAt: ${LEGACY_MOBILE_BRIDGE_STARTS_AT:-}
      LegacyMobileBridge__EndsAt: ${LEGACY_MOBILE_BRIDGE_ENDS_AT:-}
      Http__KnownProxies__0: ${TRUSTED_PROXY_IP:-172.28.90.2}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Twilio__FromNumber: ${TWILIO_FROM_NUMBER:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - dotnet
        - LefteriaFc.Api.dll
        - --healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app
      - data
      - egress

  migrate:
    <<: *hardened-runtime
    restart: "no"
    tmpfs: [/tmp:size=64m]
    mem_limit: ${LEFTERIA_MIGRATE_MEMORY_LIMIT:-512m}
    cpus: ${LEFTERIA_MIGRATE_CPUS:-1.0}
    pids_limit: 128
    profiles: [tools]
    image: ${LEFTERIA_API_IMAGE:-lefteria-fc-os-api:local}
    build:
      context: ./backend
    command: [--migrate]
    environment:
      LEFTERIA_MIGRATION_HOST: postgres
      LEFTERIA_MIGRATION_DATABASE: ${POSTGRES_DB}
      LEFTERIA_MIGRATION_USERNAME: ${POSTGRES_USER}
      LEFTERIA_MIGRATION_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  postgres:
    <<: *hardened-runtime
    # PostgreSQL requires ownership capabilities on first initialization.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: [/tmp:size=64m, /var/run/postgresql:size=16m]
    mem_limit: ${LEFTERIA_POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${LEFTERIA_POSTGRES_CPUS:-1.0}
    pids_limit: 160
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?Set DATABASE_APP_PASSWORD in .env}
      DATABASE_APP_USER: ${DATABASE_APP_USER:?Set DATABASE_APP_USER in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./ops/postgres:/opt/lefteria-postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  public:
  app:
    internal: true
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.28.90.0/24}
          ip_range: ${APP_NETWORK_DYNAMIC_RANGE:-172.28.90.128/25}
  data:
    internal: true
  # API outbound HTTPS for SMS providers; no published ports.
  egress:
