name: Browser UI visual audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/browser-ui-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-audit:
    name: Browser screenshots and viewport overflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install OS frontend and pinned browser tooling
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture isolated OS public and app-login viewports
        working-directory: frontend
        env:
          LEFTERIA_UI_ARTIFACTS: ${{ runner.temp }}/lefteria-ui-screenshots
        run: node scripts/ui-visual-audit.mjs
      - name: Upload screenshots and width measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lefteria-ui-screenshots/
          if-no-files-found: warn
          retention-days: 7
