name: Browser UI visual audit

on:
  # Production release candidates require browser proof at the exact main
  # commit SHA, including for backend-only and security-only changes.
  push:
    branches: [main]
  pull_request:
    branches: [main, 'rewrite/**', 'feat/**', 'fix/**']
    paths:
      - 'frontend/**'
      - '.github/workflows/browser-ui-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-audit:
    name: Browser screenshots and viewport overflow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install OS frontend and pinned browser tooling
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture isolated OS public routes, unavailable states and app login
        working-directory: frontend
        env:
          LEFTERIA_UI_ARTIFACTS: ${{ runner.temp }}/lefteria-ui-screenshots
        run: node scripts/ui-visual-audit.mjs
      - name: Capture five isolated role component layouts
        working-directory: frontend
        env:
          LEFTERIA_UI_ARTIFACTS: ${{ runner.temp }}/lefteria-ui-screenshots
        run: node scripts/ui-role-visual-audit.mjs
      - name: Reject forged cached role hints and invalid mobile tokens
        working-directory: frontend
        env:
          LEFTERIA_UI_ARTIFACTS: ${{ runner.temp }}/lefteria-ui-screenshots
        run: node scripts/ui-mobile-auth-denial-audit.mjs
      - name: Exercise real mobile routes with isolated synthetic authenticated role responses
        working-directory: frontend
        env:
          LEFTERIA_UI_ARTIFACTS: ${{ runner.temp }}/lefteria-ui-screenshots
        run: node scripts/ui-mobile-authenticated-audit.mjs
      - name: Verify native PNG pixel comparator against a known one-pixel change
        working-directory: frontend
        run: node scripts/compare-reference-screenshots.mjs --self-test
      - name: Record reference pixel comparison status
        working-directory: frontend
        env:
          LEFTERIA_UI_ARTIFACTS: ${{ runner.temp }}/lefteria-ui-screenshots
          # Reference screenshots are not stored in Git; default CI explicitly
          # writes UNVERIFIED rather than falsely claiming visual parity.
          # A private staging review can run the same command with immutable
          # originals and LEFTERIA_REQUIRE_PIXEL_PARITY=1.
        run: node scripts/compare-reference-screenshots.mjs
      - name: Upload screenshots and width measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lefteria-ui-screenshots/
          if-no-files-found: warn
          retention-days: 7
