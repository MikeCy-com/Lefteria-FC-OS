# Temporary branch-only code generation. The trigger is restricted to THIS
# file's initial branch push. No production deployment or provider traffic.
name: Payabl branch contract sync
on:
  push:
    branches:
      - feature/payabl-payments-foundation
    paths:
      - .github/workflows/payabl-contract-sync.yml

permissions:
  contents: write

jobs:
  contracts:
    if: github.repository == 'MikeCy-com/Lefteria-FC-OS' && github.ref == 'refs/heads/feature/payabl-payments-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: dotnet restore backend/src/LefteriaFc.Api/LefteriaFc.Api.csproj --locked-mode
      - run: dotnet build backend/src/LefteriaFc.Api/LefteriaFc.Api.csproj --configuration Release --no-restore
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --prefix tools/api-client --no-audit --no-fund
      - run: npm run api:export && npm run api:generate
        working-directory: frontend
      - name: Commit generated API contract only to development branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/feature/payabl-payments-foundation"
          git add -- contracts/openapi.json frontend/src/lib/api/schema.d.ts
          if ! git diff --cached --quiet; then
            git -c user.name='lefteria-contract-bot' -c user.email='noreply@github.com' \
              commit -m 'chore(payabl): regenerate audited OpenAPI and typed client'
            git push origin HEAD:refs/heads/feature/payabl-payments-foundation
          fi
