name: Temporary Payabl contract generation
on:
  push:
    branches:
      - feature/payabl-payments-foundation
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: payabl-contract-temp
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: dotnet restore backend/src/LefteriaFc.Api/LefteriaFc.Api.csproj --locked-mode
      - run: dotnet build backend/src/LefteriaFc.Api/LefteriaFc.Api.csproj --configuration Release --no-restore
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm ci --prefix tools/api-client --no-audit --no-fund
      - run: npm run api:export && npm run api:generate
        working-directory: frontend
      - name: Commit generated API contract only
        run: |
          set -euo pipefail
          git add contracts/openapi.json frontend/src/lib/api/schema.d.ts
          if git diff --cached --quiet; then
            echo "API contract already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(payabl): regenerate Academy fee OpenAPI and client contracts"
            git push origin HEAD:feature/payabl-payments-foundation
          fi
